async function loadRep(){try{rep.col={daily:'day',weekly:'week_start',monthly:'month_start'}[rep.m];rep.rows=await sb(`coffee_report_${rep.m}?order=${rep.col}.desc&limit=300`)}catch(e){toast('Report error: '+String(e.message).slice(0,80))}if(view==='rep')render()}
function repV(){const g={};rep.rows.filter(r=>!rep.b||r.branch_id==rep.b).forEach(r=>{const k=r[rep.col],x=g[k]||(g[k]={k,n:0,s:0});x.n+=r.orders;x.s+=+r.sales});
 const L=Object.values(g).sort((a,b)=>a.k<b.k?1:-1).slice(0,rep.m==='daily'?31:rep.m==='weekly'?13:12),mx=Math.max(1,...L.map(x=>x.s)),T=L.reduce((a,x)=>a+x.s,0),N=L.reduce((a,x)=>a+x.n,0);
 return `<div class="card"><div class="row">${[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(([k,l])=>`<button class="${rep.m===k?'on':''}" onclick="rep.m='${k}';loadRep()">${l}</button>`).join('')}${isA()?`<select onchange="rep.b=+this.value;render()"><option value="0">All branches</option>${brs.map(x=>`<option value="${x.id}"${rep.b==x.id?' selected':''}>${x.name}</option>`).join('')}</select>`:''}</div>
 <div class="stats"><div class="card stat"><span class="muted">Sales</span><b>${m$(T)}</b></div><div class="card stat"><span class="muted">Orders</span><b>${N}</b></div><div class="card stat"><span class="muted">Avg order</span><b>${m$(N?T/N:0)}</b></div></div>
 <div class="wrap"><table><tr><th>${rep.m==='daily'?'Day':rep.m==='weekly'?'Week of':'Month'}</th><th>Orders</th><th>Sales</th><th></th></tr>${L.map(x=>`<tr><td>${String(x.k).slice(0,rep.m==='monthly'?7:10)}</td><td>${x.n}</td><td>${m$(x.s)}</td><td style="width:35%"><div style="background:var(--accent);height:10px;border-radius:5px;width:${Math.round(x.s/mx*100)}%"></div></td></tr>`).join('')||'<tr><td colspan=4 class="muted">No sales yet</td></tr>'}</table></div></div>`}
function setV(){let h=`<div class="card" style="max-width:640px"><h3>Account</h3><p>${prof.name||''} · ${prof.email||''} · <b>${prof.role}</b> · ${bn()}</p><button onclick="logout()">Sign out</button></div>`;if(!isA())return h;
 const o=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
 return h+setV0()+`<div class="card" style="max-width:640px"><h3>Branches</h3>${brs.map(x=>`<div class="row"><input value="${x.name}" onchange="bUp(${x.id},this.value)"></div>`).join('')}<div class="row"><input id="nb" placeholder="New branch name"><button class="pri" onclick="bAdd()">+ Add branch</button></div></div>
 <div class="card wrap"><h3>Staff (new users start as "pending")</h3><table><tr><th>Email</th><th>Name</th><th>Role</th><th>Branch</th></tr>${staff.map(u=>`<tr><td>${u.email}</td><td><input value="${u.name||''}" onchange="pUp('${u.id}',{name:this.value})"></td><td><select ${u.id===prof.id?'disabled':''} onchange="pUp('${u.id}',{role:this.value})">${o(['pending','cashier','manager','admin'],u.role)}</select></td><td><select onchange="pUp('${u.id}',{branch_id:+this.value})">${brs.map(x=>`<option value="${x.id}"${x.id===u.branch_id?' selected':''}>${x.name}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}
const patch=(t,b)=>sb(t,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(b)});
async function bUp(id,n){try{await patch('coffee_branches?id=eq.'+id,{name:n});brs.find(x=>x.id===id).name=n;S.set.branch=bn();render()}catch(e){toast('Error')}}
async function bAdd(){const n=$('#nb').value.trim();if(!n)return;try{brs.push((await sb('coffee_branches',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name:n})}))[0]);render()}catch(e){toast('Error')}}
async function pUp(id,p){try{await patch('coffee_profiles?id=eq.'+id,p);Object.assign(staff.find(u=>u.id===id),p);toast('Updated')}catch(e){toast('Error')}}
render();if(sess)boot();
</script></body></html>
